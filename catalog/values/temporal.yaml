# Helm values for Temporal workflow engine (chart 1.x)
# Local-first defaults: single replica, uses cluster PostgreSQL
#
# Chart 1.x removed all database sub-charts (top-level cassandra/mysql/
# postgresql/elasticsearch keys are rejected by the chart's validations)
# and moved persistence to server.config.persistence.datastores in raw
# Temporal server config format — see the chart's UPGRADING.md.

# Each Temporal component runs as its own Deployment, so total cluster
# footprint is the sum of all four services.
server:
  # Global replica count — applies to all four services (frontend, history,
  # matching, worker). The chart has no per-service replicaCount key.
  replicaCount: 1

  config:
    persistence:
      # Persistence store - uses cluster's PostgreSQL instance.
      # manageSchema makes the chart's schema job run migrations (replaces the
      # old schema.setup.enabled). createDatabase must stay false: the
      # PostgreSQL bootstrap already creates both databases and the `temporal`
      # role has no CREATEDB. PostgreSQL checks that privilege *before* the
      # "already exists" check, so the schema job's create-database init
      # container would fail with 42501 (which Temporal does not tolerate — it
      # only ignores 42P04) and block manage-schema from ever running.
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: "postgresql-rw.storage.svc.cluster.local:5432"
            connectProtocol: tcp
            user: temporal
            password: temporal
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: "postgresql-rw.storage.svc.cluster.local:5432"
            connectProtocol: tcp
            user: temporal
            password: temporal

  frontend:
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 384Mi
        cpu: 250m

  history:
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 768Mi
        cpu: 500m

  matching:
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 384Mi
        cpu: 250m

  worker:
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 384Mi
        cpu: 250m

web:
  replicaCount: 1
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m
